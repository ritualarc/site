<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Ritual Arc{% endblock %}</title>
  <meta name="description" content="Ritual Arc explores the behavioural life of fashion through cultural observation, emotional relevance, and future-facing insight." />
  <link rel="icon" href="/static/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="{{ root_domain }}">
        <img src="/static/favicon.png" alt="" />
        <span>Ritual Arc</span>
      </a>
      <nav class="primary-nav">
        {% for href, label in nav_links %}
        <a href="{{ href }}"{% if active == href %} class="active"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      {% for href, label in footer_links %}
      <a href="{{ href }}">{{ label }}</a>
      {% endfor %}
    </div>
    <div class="footer-links">
      {% for href, label in legal_links %}
      <a href="{{ href }}">{{ label }}</a>
      {% endfor %}
    </div>
    <div style="margin-top: 0.75rem;">&copy; 2026 by Ritual Arc</div>
  </footer>
</body>
</html>
