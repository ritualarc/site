<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}The Ritual Arc{% endblock %}</title>
  <meta name="description" content="The Ritual Arc explores the behavioural life of fashion through cultural observation, emotional relevance, and future-facing insight." />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/">The Ritual Arc</a>
      <nav class="primary-nav">
        {% for href, label in nav_links %}
        <a href="{{ href }}"{% if active == href %} class="active"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </div>
    <div class="footer-links">
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="/accessibility-statement">Accessibility Statement</a>
      <a href="/terms-and-conditions">Terms &amp; Conditions</a>
    </div>
    <div style="margin-top: 0.75rem;">&copy; 2026 by The Ritual Arc</div>
  </footer>
</body>
</html>
